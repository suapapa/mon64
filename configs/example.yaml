listen: ":8080"
scrape_interval: 15s   # default per-node interval; override with nodes[].scrape_interval
scrape_timeout: 5s

exports:
  pixoo64:
    - badge: homin-lan
  prometheuses:
    - port: "9100"
      nodes:
        - spark
    - port: "9101"
      nodes:
        - omv

badges:
  - name: homin-lan
    type: rect64
    nodes:
      - spark
      - vraptor
      - omv
    exports:
      - pixoo64
  - name: homin-dev
    type: circle240
    nodes:
      - omv

nodes:
  - name: spark
    prom_fmt: nv-monitor
    prom_endpoint: http://spark.local:9101/metrics
    # prom_api_key: ""  # optional; when set, sends Authorization: Bearer {key}
    collects:
      - cpu
      - gpu
      - mem

  - name: vraptor
    prom_fmt: node-exporter
    prom_endpoint: http://vraptor.local:9100/metrics
    collects:
      - cpu
      - mem

  - name: omv
    prom_fmt: node-exporter
    prom_endpoint: http://omv.local:9100/metrics
    collects:
      - cpu
      - mem
